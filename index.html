<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SERFA TEKNİK – Şantiye Takip</title>
  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #1a2d4f 0%, #2d3e52 100%);
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }

    .login-container {
      background: #fff;
      padding: 40px 30px;
      width: 350px;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.3);
      text-align: center;
      animation: slideIn 0.5s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(-20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .login-container .logo {
      max-width: 220px;
      margin: 0 auto 25px auto;
      display: block;
    }

    .login-container h1 {
      margin-bottom: 10px;
      color: #1a2d4f;
      font-size: 22px;
    }

    .login-container p.subtitle {
      color: #666;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .login-container input {
      width: 100%;
      padding: 12px 15px;
      margin-bottom: 15px;
      border: 2px solid #e0e0e0;
      border-radius: 6px;
      transition: all 0.3s;
      font-size: 14px;
    }

    .login-container input:focus {
      outline: none;
      border-color: #FFA500;
      box-shadow: 0 0 0 3px rgba(255, 165, 0, 0.1);
    }

    .login-container button {
      width: 100%;
      padding: 13px;
      background: linear-gradient(135deg, #1a2d4f 0%, #2d3e52 100%);
      color: #fff;
      border: none;
      cursor: pointer;
      border-radius: 6px;
      font-weight: bold;
      font-size: 15px;
      transition: all 0.3s;
    }

    .login-container button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(26, 45, 79, 0.3);
    }

    .login-container button:active {
      transform: translateY(0);
    }

    .error {
      color: #dc3545;
      margin-top: 15px;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>

  <div class="login-container">
    <img src="serfa-logo.png" alt="SERFA TEKNİK" class="logo" />
    <h1>Şantiye Takip Sistemi</h1>
    <p class="subtitle">Giriş yaparak devam edin</p>

    <input type="text" id="username" placeholder="Kullanıcı Adı" />
    <input type="password" id="pin" placeholder="PIN" />

    <button onclick="login()">Giriş Yap</button>

    <p id="error" class="error"></p>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app-gpt.js"></script>
</body>
</html>

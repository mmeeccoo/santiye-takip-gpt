<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <title>Şantiye Takip – Ana Ekran</title>
  <link rel="stylesheet" href="style-gpt.css">
</head>
<body>

  <div class="login-container">
    <h1>Hoş geldin <span id="workerName"></span> <span id="roleIcon"></span></h1>

    <p>Bugün ne yapmak istiyorsun?</p>

    <!-- İşçi Menüsü -->
    <div id="workerMenu" style="display:none;">
      <button onclick="location.href='giris-cikis-gpt.html'">📍 Giriş – Çıkış</button>
      <button onclick="location.href='malzeme-bildirim-gpt.html'">📦 Malzeme Bildirimi</button>
    </div>

    <!-- Admin Menüsü -->
    <div id="adminMenu" style="display:none;">
      <button onclick="location.href='gunluk-rapor-gpt.html'">📊 Günlük Rapor</button>
      <button onclick="location.href='aylik-rapor-gpt.html'">📅 Aylık Rapor</button>
      <button onclick="location.href='malzeme-bildirim-gpt.html'">📦 Malzeme Bildirimleri</button>
      <button onclick="location.href='yonetim-gpt.html'">⚙️ Yönetim</button>
    </div>

    <button onclick="logout()" style="background:#dc3545; margin-top: 20px;">Çıkış</button>

  </div>
  
  <script>
    const user = localStorage.getItem("loggedUser");
    const role = localStorage.getItem("userRole");

    if (!user) {
      window.location.href = "index.html";
    }

    function logout() {
      localStorage.removeItem("loggedUser");
      localStorage.removeItem("userRole");
      window.location.href = "index.html";
    }

    // İsim ve menüyü ayarla
    document.getElementById("workerName").textContent = user;

    if (role === 'admin') {
      document.getElementById("roleIcon").textContent = "👔";
      document.getElementById("adminMenu").style.display = "block";
    } else {
      document.getElementById("roleIcon").textContent = "👷";
      document.getElementById("workerMenu").style.display = "block";
    }
  </script>

</body>
</html>
